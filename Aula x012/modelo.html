<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hora do Dia</title>
    <link rel="stylesheet" href="estilo.css"> <!-- Link para seu CSS -->
</head>
<body onload="carregar()"> <!-- CHAMA A FUNÇÃO JS QUANDO A PÁGINA CARREGA -->

    <header>
        <h1>Hora do Dia</h1>
    </header>

    <section>
        <div id="msg"> 
            <!-- O JavaScript vai preencher esta div com a hora e a saudação -->
        </div>
        <div id="foto">
            <!-- O JavaScript vai definir o src desta imagem -->
            <!-- Use um nome de arquivo consistente e em minúsculas como padrão -->
            <img id="imagem" src="manha.jpg" alt="Foto do dia"> 
        </div>
    </section>

    <footer>
        <p>© CursoemVideo</p>
    </footer>

    <script src="script.js"></script> <!-- Link para seu JavaScript -->

</body>
</html>
