<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Contador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Vamos contar!</h1>
    </header>
    <section>
        <div id="dados">
            <!-- Correção: Adicionado 'for' para ligar ao input -->
            <label for="txti">Início:</label>
            <input type="number" id="txti" aria-label="Início da contagem">

            <!-- Correção: Adicionado 'for' para ligar ao input -->
            <label for="txtf">Fim:</label>
            <input type="number" id="txtf" aria-label="Fim da contagem">

            <!-- Correção: Adicionado 'for' para ligar ao input -->
            <label for="txtp">Passo:</label>
            <input type="number" id="txtp" aria-label="Passo da contagem">

            <!-- Correção: Adicionado type="button" -->
            <button id="contarBtn" type="button">Contar!</button>
            <!-- Correção: Adicionado type="button" -->
            <button id="resetBtn" type="button">Resetar</button>
        </div>
        <div id="res">Preparando a contagem...</div>
    </section>
    <footer>
        <p>© CursoemVideo</p>
    </footer>
    <script src="javascript.js"></script>
</body>
</html>
