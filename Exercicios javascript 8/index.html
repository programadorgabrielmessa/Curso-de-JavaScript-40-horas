<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Analisador de Números</h2>
        <form id="numberForm">
            <label for="numberInput">Número (entre 1 e 100):</label><br>
            <input type="number" id="numberInput" min="1" max="100" required><br>
            <label for="valuesOutput">Valores já digitados:</label><br>
            <textarea id="valuesOutput" rows="5" readonly></textarea><br>
            <button type="button" id="addBtn">Adicionar</button>
            <button type="button" id="finalizeBtn">Finalizar</button>
        </form>
    </div>
    <footer>
        <p>© CursoemVideo</p>
    </footer>

    <script src="parte 7 .js"></script>
</body>
</html>
